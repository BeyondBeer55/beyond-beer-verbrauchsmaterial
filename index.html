function csvCell(v){return '"'+String(v??"").replace(/"/g,'""')+'"'}
function exportCSV(){
  const headers=["id","name","articleNo","stock","minimum","orderQty","location","ean","supplier","photo"];
  const rows=products.map(p=>headers.map(h=>csvCell(p[h])).join(";"));
  const csv="\uFEFF"+[headers.join(";"),...rows].join("\r\n");
  downloadBlob(new Blob([csv],{type:"text/csv;charset=utf-8"}),"Beyond_Beer_Bestand.csv");
}
function parseCSV(text){
  text=text.replace(/^\uFEFF/,"");
  const first=(text.split(/\r?\n/)[0]||"");
  const sep=first.includes(";")?";":",";
  const rows=[]; let row=[],cell="",quoted=false;
  for(let i=0;i<text.length;i++){
    const ch=text[i], next=text[i+1];
    if(ch==='"'&&quoted&&next==='"'){cell+='"';i++;continue}
    if(ch==='"'){quoted=!quoted;continue}
    if(ch===sep&&!quoted){row.push(cell);cell="";continue}
    if((ch==='\n'||ch==='\r')&&!quoted){if(ch==='\r'&&next==='\n')i++;row.push(cell);cell="";if(row.some(x=>x!==""))rows.push(row);row=[];continue}
    cell+=ch;
  }
  if(cell!==""||row.length){row.push(cell);if(row.some(x=>x!==""))rows.push(row)}
  if(!rows.length)return [];
  const headers=rows[0].map(x=>x.trim());
  return rows.slice(1).map(r=>{const o={};headers.forEach((h,i)=>o[h]=r[i]??"");return o;});
}
async function importBestand(event){
  const file=event.target.files&&event.target.files[0]; if(!file)return;
  try{
    const text=await file.text(); let imported;
    if(file.name.toLowerCase().endsWith(".csv")) imported=parseCSV(text);
    else {const data=JSON.parse(text); imported=Array.isArray(data)?data:data.products;}
    if(!Array.isArray(imported)||!imported.length) throw new Error("Keine Produkte gefunden");
    const byId=new Map(imported.map(p=>[Number(p.id),p]));
    const byName=new Map(imported.map(p=>[String(p.name||"").trim().toLowerCase(),p]));
    products=initialProducts.map(p=>{
      const imp=byId.get(Number(p.id))||byName.get(String(p.name).trim().toLowerCase());
      if(!imp)return {...p};
      return {...p,...imp,id:Number(imp.id)||p.id,stock:Math.max(0,parseInt(imp.stock)||0),minimum:Math.max(0,parseInt(imp.minimum)||0),orderQty:Math.max(1,parseInt(imp.orderQty)||1)};
    });
    imported.forEach(p=>{if(!products.some(x=>Number(x.id)===Number(p.id)))products.push(p)});
    save(); render(); alert("Bestand erfolgreich importiert.");
  }catch(e){alert("Import fehlgeschlagen. Bitte eine gültige JSON- oder CSV-Datei auswählen.");}
  event.target.value="";
}

// Unicode-safe PDF: render the order onto a browser canvas, then embed the
// resulting JPEG page(s) into a tiny PDF. This avoids Type1/WinAnsi encoding
// problems with German characters such as ä, ö, ü and ß.
function makePdfPage(items, pageIndex, totalPages){
  const scale=2, W=794, H=1123;
  const c=document.createElement("canvas"); c.width=W*scale; c.height=H*scale;
  const ctx=c.getContext("2d"); ctx.scale(scale,scale);
  ctx.fillStyle="#fff"; ctx.fillRect(0,0,W,H);
  ctx.fillStyle="#111";
  ctx.font="700 28px Arial, sans-serif"; ctx.fillText("BEYOND BEER",48,58);
  ctx.font="700 18px Arial, sans-serif"; ctx.fillText("VERBRAUCHSMATERIAL - BESTELLUNG",48,91);
  ctx.font="14px Arial, sans-serif"; ctx.fillStyle="#555";
  ctx.fillText(new Date().toLocaleDateString("de-DE"),48,117);

  let y=165;
  ctx.fillStyle="#111"; ctx.font="700 14px Arial, sans-serif";
  ctx.fillText("ARTIKEL",48,y); ctx.fillText("ART.-NR.",440,y); ctx.fillText("ANZAHL",650,y);
  ctx.strokeStyle="#ddd"; ctx.lineWidth=1; ctx.beginPath(); ctx.moveTo(48,y+12); ctx.lineTo(746,y+12); ctx.stroke();
  y+=42;
  ctx.font="14px Arial, sans-serif";
  const pageItems=items.slice(pageIndex*16,(pageIndex+1)*16);
  pageItems.forEach(x=>{
    ctx.fillStyle="#111"; ctx.fillText(String(x.name||"").slice(0,48),48,y);
    ctx.fillStyle="#555"; ctx.fillText(String(x.articleNo||""),440,y);
    ctx.fillStyle="#111"; ctx.font="700 14px Arial, sans-serif"; ctx.fillText(String(x.qty)+" Stück",650,y);
    ctx.font="14px Arial, sans-serif";
    ctx.strokeStyle="#eee"; ctx.beginPath(); ctx.moveTo(48,y+10); ctx.lineTo(746,y+10); ctx.stroke();
    y+=48;
  });
  if(pageIndex===totalPages-1){
    y+=18; ctx.font="700 16px Arial, sans-serif";
    ctx.fillText("Gesamt: "+items.reduce((a,x)=>a+x.qty,0)+" Stück",48,y);
  }
  ctx.fillStyle="#888"; ctx.font="11px Arial, sans-serif";
  ctx.fillText("Seite "+(pageIndex+1)+" / "+totalPages,48,H-30);
  return c.toDataURL("image/jpeg",0.92);
}

function dataUrlToBytes(dataUrl){
  const b64=dataUrl.split(",")[1];
  const bin=atob(b64), out=new Uint8Array(bin.length);
  for(let i=0;i<bin.length;i++) out[i]=bin.charCodeAt(i);
  return out;
}
function asciiBytes(s){return new TextEncoder().encode(s)}
function concatBytes(parts){let n=parts.reduce((a,p)=>a+p.length,0),out=new Uint8Array(n),o=0;for(const p of parts){out.set(p,o);o+=p.length}return out}

function buildOrderPdf(items){
  const totalPages=Math.max(1,Math.ceil(items.length/16));
  const images=[];
  for(let i=0;i<totalPages;i++) images.push(dataUrlToBytes(makePdfPage(items,i,totalPages)));

  const objects=[];
  objects.push("<< /Type /Catalog /Pages 2 0 R >>");
  const pageNums=[], contentNums=[], imageNums=[];
  let next=3;
  for(let i=0;i<totalPages;i++){pageNums.push(next++); contentNums.push(next++); imageNums.push(next++);}
  const kids=pageNums.map(n=>n+" 0 R").join(" ");
  objects.push("<< /Type /Pages /Kids ["+kids+"] /Count "+totalPages+" >>");
  for(let i=0;i<totalPages;i++){
    objects.push("<< /Type /Page /Parent 2 0 R /MediaBox [0 0 595 842] /Resources << /XObject << /Im"+i+" "+imageNums[i]+" 0 R >> >> /Contents "+contentNums[i]+" 0 R >>");
    const stream="q\n595 0 0 842 0 0 cm\n/Im"+i+" Do\nQ\n";
    objects.push({raw:true,dict:"<< /Length "+stream.length+" >>",stream});
    objects.push({image:true,bytes:images[i],dict:"<< /Type /XObject /Subtype /Image /Width 1588 /Height 2246 /ColorSpace /DeviceRGB /BitsPerComponent 8 /Filter /DCTDecode /Length "+images[i].length+" >>"});
  }
  let chunks=[asciiBytes("%PDF-1.4\n")], offsets=[0], pos=chunks[0].length;
  for(let i=0;i<objects.length;i++){
    const num=i+1; offsets[num]=pos;
    let head=asciiBytes(num+" 0 obj\n"), body;
    const o=objects[i];
    if(typeof o==="string") body=asciiBytes(o+"\nendobj\n");
    else body=concatBytes([asciiBytes(o.dict+"\nstream\n"),o.image?o.bytes:asciiBytes(o.stream),asciiBytes("\nendstream\nendobj\n")]);
    chunks.push(head,body); pos+=head.length+body.length;
  }
  const xref=pos;
  let x="xref\n0 "+(objects.length+1)+"\n0000000000 65535 f \n";
  for(let i=1;i<=objects.length;i++) x+=String(offsets[i]).padStart(10,"0")+" 00000 n \n";
  x+="trailer\n<< /Size "+(objects.length+1)+" /Root 1 0 R >>\nstartxref\n"+xref+"\n%%EOF";
  chunks.push(asciiBytes(x));
  return new Blob([concatBytes(chunks)],{type:"application/pdf"});
}
async function sendOrder(){
  const items=makeOrderData();
  if(!items.length){alert("Der Warenkorb ist leer.");return;}
  const pdf=buildOrderPdf(items);
  const filename="Beyond_Beer_Bestellung_"+new Date().toLocaleDateString("de-DE").replace(/\./g,"-")+".pdf";
  const file=new File([pdf],filename,{type:"application/pdf"});
  const subject="Beyond Beer – Verbrauchsmaterial Bestellung";
  const body="Hallo Ruggero,\n\nanbei die aktuelle Bestellung des Stores für Verbrauchsmaterial.\n\nViele Grüße\nBeyond Beer Store\n\n"+
    items.map(x=>x.name+" – "+x.qty+" Stück").join("\n");

  // On iPad/iPhone/Android this opens the native share sheet, where Outlook
  // can be selected and the PDF is attached directly.
  if(navigator.share && (!navigator.canShare || navigator.canShare({files:[file]}))){
    try{await navigator.share({title:subject,text:body,files:[file]});return;}
    catch(e){if(e&&e.name==="AbortError")return;}
  }

  // Desktop fallback: save the Unicode-safe PDF and open Outlook/mail client.
  const a=document.createElement("a");a.href=URL.createObjectURL(pdf);a.download=filename;a.click();
  setTimeout(()=>URL.revokeObjectURL(a.href),1500);
  location.href="mailto:ruggero@beyondbeer.de?subject="+encodeURIComponent(subject)+"&body="+encodeURIComponent(body+"\n\nPDF wurde heruntergeladen und kann an die Mail angehängt werden.");
}
